# Development Configuration for GD Tahara Backend
# Load credentials from .env (gitignored — copy .env.example to .env and fill in values)
spring.config.import=optional:file:.env[.properties]

# Enable debug logging
logging.level.com.gdtahara.gdtaharabackend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Show SQL queries
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Hot reload for development
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Disable security for testing (if needed)
# management.security.enabled=false

# Label printer — use log stub in dev (no hardware needed)
label.printer.mode=log

# CORS settings for development
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

# Error handling
server.error.include-stacktrace=always
server.error.include-message=always
