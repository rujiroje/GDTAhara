# Test profile — in-memory H2 so no SQL Server is required in CI
# Flyway migrations are T-SQL (SQL Server) — disabled here; schema built from JPA entities
spring.datasource.url=jdbc:h2:mem:gdtahara_test;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.datasource.hikari.initialization-fail-timeout=-1

jwt.secret=test-secret-64chars-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
jwt.expiration=3600000

# Suppress unnecessary logs in tests
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
