# Server configuration
server.port=8080

# Database configuration - Remote SQL Server
# Override with env vars in production: SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:sqlserver://10.1.53.33:1433;databaseName=GDTahara;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;loginTimeout=30;socketTimeout=60000
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tst123##}

# HikariCP Connection Pool
# NOTE for production: override username/password via SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD env vars
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=GDTaharaPool
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# Jackson - serialize LocalDate/LocalDateTime as ISO strings (not arrays)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# JWT configuration
# Set env var JWT_SECRET to a random string of at least 64 characters before deploying to production.
# Generate with: openssl rand -hex 32
jwt.secret=${JWT_SECRET:REPLACE-THIS-WITH-64-CHAR-RANDOM-SECRET-BEFORE-PRODUCTION-DEPLOY!!}
jwt.expiration=86400000

# Actuator & Metrics
# Expose health + prometheus only; restrict others by default
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
# Tag every metric with app name and version for Grafana filtering
management.metrics.tags.application=gdtahara-backend
management.metrics.tags.environment=${APP_ENV:local}
# HikariCP metrics (DB pool stats in Prometheus)
management.metrics.enable.hikaricp=true

# Logging
logging.level.com.gdtahara.gdtaharabackend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.zaxxer.hikari=INFO
