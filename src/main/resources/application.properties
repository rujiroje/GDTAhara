# Server configuration
server.port=8080

# Database configuration - Remote SQL Server
spring.datasource.url=jdbc:sqlserver://10.1.53.33:1433;databaseName=GDTahara;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=tst123##

# Jackson - serialize LocalDate/LocalDateTime as ISO strings (not arrays)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# JWT configuration
jwt.secret=mySecretKey
jwt.expiration=86400000

# Logging
logging.level.com.gdtahara.gdtaharabackend=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

