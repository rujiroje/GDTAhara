# Server configuration
server.port=8080

# Database configuration - Remote SQL Server
# Required environment variables (no defaults — app will fail to start if missing):
#   SPRING_DATASOURCE_USERNAME  — dedicated SQL Server login (e.g. 'gdpd', NOT 'sa')
#   SPRING_DATASOURCE_PASSWORD  — strong password; never the legacy 'tst123##'
#   JWT_SECRET                  — 64+ chars random; generate with: openssl rand -hex 32
# See .env.example for template. See README.md "Environment Setup" section for details.
spring.datasource.url=jdbc:sqlserver://10.1.53.33:1433;databaseName=GDTahara;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;loginTimeout=30;socketTimeout=60000
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP Connection Pool
# NOTE for production: override username/password via SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD env vars
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=GDTaharaPool
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# Jackson - serialize LocalDate/LocalDateTime as ISO strings (not arrays)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
# Dialect auto-detected from JDBC URL in Hibernate 6 — no need to set explicitly (HHH90000025)
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Actuator & Metrics
# Expose health + prometheus only; restrict others by default
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
# Tag every metric with app name and version for Grafana filtering
management.metrics.tags.application=gdtahara-backend
management.metrics.tags.environment=${APP_ENV:local}
# HikariCP metrics (DB pool stats in Prometheus)
management.metrics.enable.hikaricp=true

# Logging
logging.level.com.gdtahara.gdtaharabackend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.zaxxer.hikari=INFO
# Suppress "UserDetailsService beans will not be used" — expected when AuthenticationProvider @Bean is present
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Label printer — W14.2
# mode=log (default): logs ZPL to console, no printer required (dev/test)
# mode=tcp: sends ZPL via raw TCP socket to host:port (e.g. 192.168.1.200:9100)
label.printer.mode=log

# File upload — setup checklist photos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Flyway — added 2026-05-29 for Phase 1 W10
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial baseline (parameter_records pre-existing)
spring.flyway.validate-on-migrate=true
