# Emergency Configuration - Bypass Repository และ Security Issues

# ปิด JPA/Database/Repository/Security ชั่วคราว
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# เปิดเฉพาะ Web
spring.main.banner-mode=console
server.port=8080

# ปิด JPA Repository scanning
spring.data.jpa.repositories.enabled=false

# ปิด Security
spring.security.enabled=false
management.security.enabled=false

# CORS settings - แม้ไม่มี Security ก็ยังต้องการ
spring.web.cors.allowed-origins=http://localhost:8080,http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging
logging.level.com.gdtahara.gdtaharabackend=INFO
logging.level.org.springframework.security=OFF
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data=OFF
logging.level.org.hibernate=OFF
logging.level.org.springframework.orm=OFF

# Error handling
server.error.include-stacktrace=never
server.error.include-message=always

# Emergency mode indicators
app.mode=emergency
app.message=All repository and security components disabled due to dependency issues
management.health.defaults.enabled=false
