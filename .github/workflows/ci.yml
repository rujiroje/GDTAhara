name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Compile + Unit Tests
  # Gate: build fails → PR/push is blocked
  # ─────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and run tests
        run: mvn verify --batch-mode --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2: OWASP Dependency-Check
  # Gate: CVSS >= 7 (High/Critical) → build fails
  # Runs after tests pass; push to main and PRs.
  # ─────────────────────────────────────────────
  security-scan:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache NVD vulnerability database
        uses: actions/cache@v4
        with:
          # dependency-check stores its NVD H2 DB here by default
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            nvd-data-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        run: mvn dependency-check:check -P security-scan --batch-mode --no-transfer-progress
        env:
          # Register a free NVD API key at https://nvd.nist.gov/developers/request-an-api-key
          # Add it as a repository secret named NVD_API_KEY for faster DB updates.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 30
