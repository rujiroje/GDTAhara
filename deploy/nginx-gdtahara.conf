# Nginx config for GDTahara — sub-path /MES/ on shared server
#
# เพิ่มใน server { ... } block ที่มีอยู่แล้วของ 10.1.53.30
# (ไม่ต้องสร้าง server block ใหม่ — copy แค่ 2 location blocks ด้านล่าง)
#
# หลังจาก copy แล้วรัน:
#   sudo nginx -t && sudo systemctl reload nginx

# ── วิธีเพิ่มใน config ที่มีอยู่แล้ว ───────────────────────────────────────
# เปิดไฟล์ config ของ server เดิม (เช่น /etc/nginx/sites-available/default)
# แล้วเพิ่ม 2 blocks นี้ต่อท้ายก่อน closing } ของ server block:

    # GDTahara — API proxy (ต้องอยู่ก่อน /MES/ เพื่อ match ก่อน)
    location ^~ /MES/api/ {
        proxy_pass         http://localhost:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 20M;
    }

    # GDTahara — Frontend static files (React SPA)
    location /MES/ {
        alias /var/www/gdtahara/;
        index index.html;
        # React ไม่มี URL routing ดังนั้น try_files ตรงไปที่ index.html
        try_files $uri $uri/ /MES/index.html;
    }

