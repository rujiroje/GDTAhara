# Nginx config for GDTahara
# Copy to: /etc/nginx/sites-available/gdtahara
# Then: sudo ln -s /etc/nginx/sites-available/gdtahara /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# ถ้า server มี web app อื่นอยู่แล้วบน port 80:
#   Option A: ใช้ port อื่น (เช่น listen 8090;) แล้วผู้ใช้เข้า http://IP:8090
#   Option B: ใช้ path ต่างกัน (ต้องปรับ React Router และ vite base path ด้วย)
#   Option C: ใช้ subdomain (ถ้ามี DNS)

server {
    listen 80;
    server_name 10.1.53.30;

    # ── Frontend (React SPA) ─────────────────────────────────────────────────
    root /var/www/gdtahara;
    index index.html;

    # React Router: fallback ทุก route ไป index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ────────────────────────────────────────────────────
    # Browser เรียก http://SERVER/api/... → Nginx ส่งต่อให้ Spring Boot :8080
    location /api/ {
        proxy_pass         http://localhost:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Upload files (setup checklist photos)
        client_max_body_size 20M;
    }

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/gdtahara-access.log;
    error_log  /var/log/nginx/gdtahara-error.log;
}
